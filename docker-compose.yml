services:
  postgres:
    image: postgres:16-alpine
    container_name: govproc-postgres
    environment:
      POSTGRES_DB: govproc
      POSTGRES_USER: govproc
      POSTGRES_PASSWORD: govproc
    ports:
      - "5432:5432"
    volumes:
      - govproc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govproc -d govproc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  govproc_pgdata:
